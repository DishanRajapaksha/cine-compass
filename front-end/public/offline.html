<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f0e6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>CineCompass · Offline</title>
  <style>
    html { background: #f5f0e6; color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: max(28px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); background: #f5f0e6; color: #29231f; font-family: Georgia, serif; }
    main { max-width: 420px; text-align: center; }
    img { width: 88px; height: 88px; }
    h1 { font-size: 32px; }
    p { line-height: 1.6; }
    a { display: inline-block; margin-top: 12px; background: #6e282d; color: #f5f0e6; padding: 12px 24px; border-radius: 4px; text-decoration: none; }
    a:focus-visible { outline: 2px solid #6e282d; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <img src="/apple-touch-icon.png" alt="" width="180" height="180">
    <h1>A connection for your next film.</h1>
    <p>You’re offline. Connect to the internet to see current screenings and access your account. Your saved preferences remain on this device.</p>
    <a href="/">Try again</a>
  </main>
</body>
</html>
